## ───────────────────────────────────────────────────────────────
##  Конфиг nginx для stihi-i-vremya.ru
##  Положить в: /etc/nginx/sites-available/stihi-i-vremya.ru
##  Активировать: ln -s /etc/nginx/sites-available/stihi-i-vremya.ru /etc/nginx/sites-enabled/
##  Перезапустить: sudo nginx -t && sudo systemctl reload nginx
## ───────────────────────────────────────────────────────────────

# Редирект с www на основной домен
server {
    listen 80;
    listen [::]:80;
    server_name www.stihi-i-vremya.ru;
    return 301 https://stihi-i-vremya.ru$request_uri;
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name stihi-i-vremya.ru;
    return 301 https://stihi-i-vremya.ru$request_uri;
}

# Основной HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stihi-i-vremya.ru;

    # ─── SSL ─── (укажите путь к вашим сертификатам)
    ssl_certificate     /etc/letsencrypt/live/stihi-i-vremya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stihi-i-vremya.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # ─── Безопасность ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Базовая CSP — при необходимости расширьте
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'" always;

    # ─── Корень для статики ───
    root /var/www/stihi-i-vremya/public;
    index index.html;

    # Скрываем nginx-версию
    server_tokens off;

    # Ограничение размера запроса (например, длинного стиха) — 1 MB достаточно
    client_max_body_size 1m;

    # ─── Сжатие ───
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ─── Кэширование статики ───
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── Статика админки ───
    # Файлы admin.css/admin.js лежат в отдельной папке вне корня сайта,
    # чтобы случайно не попасть в индексацию.
    location /redaktor-assets/ {
        alias /var/www/stihi-i-vremya/public-admin/;
        expires 1h;
    }

    # ─── Прокси на Node.js: страница админки и API ───
    location = /redaktor {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Главная страница и остальная статика ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Скрываем технические файлы
    location ~ /\. { deny all; }
    location ~ \.(env|json|sh|md)$ { deny all; }
}
